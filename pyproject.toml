[project]
name = "git-manager"
version = "1.0.0"
description = "Windows Git project manager GUI with right-click Explorer integration."
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "ttkbootstrap>=1.10"]

[project.scripts]
git-manager = "git_manager.qt_app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
